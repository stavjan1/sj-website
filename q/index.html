<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הצעת מחיר</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&family=Heebo:wght@400;500;700&family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M13 2L4.5 13h6l-1.5 9L18.5 10h-6z' fill='%236ABF3C'/%3E%3C/svg%3E">
    <style>
        /* Client-facing quote document — deliberately always light, like paper. */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Assistant', 'Heebo', sans-serif; background: #F5F5F4; color: #1C1917; line-height: 1.65; padding: 18px 12px 40px; }
        .sheet {
            max-width: 760px; margin: 0 auto; background: #fff;
            border: 1px solid #E7E5E4; border-radius: 12px;
            box-shadow: 0 4px 18px rgb(28 25 23 / 0.07);
            padding: 30px 28px;
        }
        .qs-loading, .qs-error { text-align: center; padding: 60px 20px; color: #57534E; }
        .qs-error { color: #B91C1C; }
        .qs-header { display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; align-items: flex-start; }
        .qs-to .lbl { color: #79716B; font-size: 0.85rem; }
        .qs-to .name { font-weight: 700; font-size: 1.1rem; }
        .qs-to .sub { color: #79716B; font-size: 0.85rem; }
        .qs-biz { text-align: center; }
        .qs-biz img { max-height: 64px; max-width: 190px; object-fit: contain; }
        .qs-biz .bn { font-weight: 700; font-size: 1.15rem; }
        .qs-biz .bo { color: #57534E; font-size: 0.85rem; }
        .qs-meta { text-align: left; color: #57534E; font-size: 0.85rem; font-variant-numeric: tabular-nums; }
        .qs-divider { height: 2px; background: #1C1917; margin: 16px 0 20px; }
        h1 { text-align: center; font-size: 1.3rem; margin-bottom: 20px; }
        .qs-item { border-bottom: 1px dashed #D6D3D1; padding: 12px 0; }
        .qs-item .t { font-weight: 700; display: flex; justify-content: space-between; gap: 10px; }
        .qs-item .t .p { white-space: nowrap; font-variant-numeric: tabular-nums; }
        .qs-item .d { color: #57534E; font-size: 0.92rem; white-space: pre-wrap; }
        .qs-total {
            display: flex; justify-content: space-between; align-items: baseline;
            background: #E6EDF7; border: 1px solid #1B4B8F; border-radius: 8px;
            padding: 14px 18px; margin: 22px 0 6px; font-weight: 700; font-size: 1.15rem;
            font-variant-numeric: tabular-nums;
        }
        .qs-vat { color: #79716B; font-size: 0.82rem; margin-bottom: 18px; }
        .qs-summary { background: #FAFAF9; border: 1px solid #E7E5E4; border-radius: 8px; padding: 12px 16px; font-size: 0.9rem; white-space: pre-wrap; margin-bottom: 16px; }
        .qs-signed {
            display: flex; align-items: center; gap: 12px;
            background: #F0FDF4; border: 1px solid #15803D; border-radius: 8px;
            padding: 10px 16px; margin-bottom: 16px; font-size: 0.9rem;
        }
        .qs-signed img { height: 44px; }
        .qs-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 22px; }
        .qs-btn {
            display: inline-flex; align-items: center; gap: 8px; min-height: 44px;
            padding: 10px 26px; border-radius: 8px; font-weight: 500; text-decoration: none;
            font-size: 0.98rem;
        }
        .qs-btn.call { background: #1C1917; color: #fff; }
        .qs-btn.wa { background: #1FAF5A; color: #fff; }
        .qs-foot { text-align: center; color: #A8A29E; font-size: 0.78rem; margin-top: 22px; }
        .qs-foot a { color: #79716B; }
        @media print { body { background: #fff; padding: 0; } .sheet { border: none; box-shadow: none; } .qs-actions { display: none; } }
    </style>
    <script>try{var t=localStorage.getItem("sj_theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
</head>
<body>
    <div class="sheet" id="sheet">
        <div class="qs-loading" id="qs-loading">טוען את ההצעה…</div>
    </div>

    <script>
        const esc = (s) => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        const fmt = (n) => (Number(n) || 0).toLocaleString('he-IL');
        // Only allow inline base64 data-image sources, matched as a COMPLETE
        // string. The share payload comes from another user's account, so it is
        // hostile data. NOTE: the previous regex anchored only at the start, so
        // everything after "data:image/png;" — including a double quote — was
        // returned verbatim and broke straight out of the src="..." attribute
        // (stored XSS). The whole value must now be a well-formed base64 data
        // URL, and the result is escaped at the sink as well. SVG stays allowed:
        // scripts inside an SVG never execute when it's loaded via <img>.
        const safeImg = (s) => /^data:image\/(png|jpe?g|gif|webp|svg\+xml);base64,[A-Za-z0-9+/]+=*$/i.test(String(s || '')) ? String(s) : '';

        async function load() {
            const t = new URLSearchParams(location.search).get('t') || '';
            const sheet = document.getElementById('sheet');
            try {
                const res = await fetch('/api/quote-share?t=' + encodeURIComponent(t));
                const body = await res.json().catch(() => ({}));
                if (!res.ok || !body.data) throw new Error((body.error && body.error.message) || 'ההצעה לא נמצאה.');
                render(body.data, sheet);
            } catch (e) {
                sheet.innerHTML = '<div class="qs-error">' + esc(e.message) + '</div>';
            }
        }

        function render(q, sheet) {
            const biz = q.business || {};
            document.title = 'הצעת מחיר ' + (q.quoteNumber || '') + (biz.name ? ', ' + biz.name : '');
            const phoneDigits = String(biz.phone || '').replace(/[^\d]/g, '');
            const waPhone = phoneDigits.startsWith('0') ? '972' + phoneDigits.slice(1) : phoneDigits;
            const items = (q.items || []).map(it => `
                <div class="qs-item">
                    <div class="t"><span>${esc(it.title)}</span>${q.showItemizedPrices && it.price ? `<span class="p">${fmt(it.price)} ₪</span>` : ''}</div>
                    ${it.description ? `<div class="d">${esc(it.description)}</div>` : ''}
                </div>`).join('');
            sheet.innerHTML = `
                <div class="qs-header">
                    <div class="qs-to">
                        <div class="lbl">לכבוד:</div>
                        <div class="name">${esc(q.clientName || '')}</div>
                        <div class="sub">${esc(q.clientSub || '')}</div>
                    </div>
                    <div class="qs-biz">
                        ${safeImg(q.logo) ? `<img src="${esc(safeImg(q.logo))}" alt="">` : ''}
                        <div class="bn">${esc(biz.name || '')}</div>
                        <div class="bo">${esc(biz.owner || '')}</div>
                    </div>
                    <div class="qs-meta">
                        <div>${esc(q.date || '')}</div>
                        <div>הצעת מחיר מס': ${esc(q.quoteNumber || '')}</div>
                    </div>
                </div>
                <div class="qs-divider"></div>
                <h1>הצעת מחיר ל${esc(q.subject || '')}</h1>
                ${items}
                <div class="qs-total"><span>סה"כ לתשלום:</span><span>${fmt(q.finalPrice)} ₪</span></div>
                <div class="qs-vat">${esc(q.vatLabel || '')}</div>
                ${q.summary ? `<div class="qs-summary"><strong>פירוט תנאים נוספים:</strong>\n${esc(q.summary)}</div>` : ''}
                ${q.signature && safeImg(q.signature.img) ? `
                    <div class="qs-signed">
                        <img src="${esc(safeImg(q.signature.img))}" alt="חתימה">
                        <span>✓ ההצעה אושרה ונחתמה על ידי <strong>${esc(q.signature.name)}</strong> בתאריך ${esc(q.signature.date)}</span>
                    </div>` : ''}
                <div class="qs-actions">
                    ${biz.phone ? `<a class="qs-btn call" href="tel:${esc(biz.phone)}">${esc(biz.phone)}</a>` : ''}
                    ${waPhone ? `<a class="qs-btn wa" target="_blank" rel="noopener" href="https://wa.me/${waPhone}?text=${encodeURIComponent('היי, בקשר להצעת מחיר ' + (q.quoteNumber || ''))}">וואטסאפ</a>` : ''}
                </div>
                <div class="qs-foot">הופק באמצעות <a href="/zerem/">זרם · תוכנת הצעות המחיר</a></div>
            `;
        }

        load();
    </script>
    <script src="/track.js?v=340" defer></script>
</body>
</html>
