# Pulls Microsoft Clarity UX metrics through the site's /api/clarity relay
# every 3 days and commits them into the repo, where the site-analyst routine
# (Claude) reads them — its own environment can't reach clarity.ms directly.
name: Clarity data pull

on:
  schedule:
    # Well before the 06:00 UTC analyst routine — GitHub delays scheduled
    # runs by up to ~80 minutes, so 05:00 sometimes landed after the scan.
    - cron: '30 3 */3 * *'
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write # the relay authenticates this workflow by its GitHub OIDC token

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Clarity metrics via the site relay
        id: fetch
        run: |
          # The relay's GET is admin-gated (traffic data is not public); this
          # workflow proves it is the repo's own automation with a GitHub OIDC
          # token — signed by GitHub, audience-pinned, no secret to manage.
          OIDC=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sj-clarity-pull" | jq -r '.value')
          echo "::add-mask::$OIDC"
          RESP=$(curl -sS --max-time 60 -H "X-GitHub-OIDC: $OIDC" "https://www.sj-eng.co.il/api/clarity" || echo '{}')
          OK=$(echo "$RESP" | jq -r '.ok // false')
          if [ "$OK" != "true" ]; then
            echo "No data available yet ($(echo "$RESP" | jq -r '.error // "unknown"')) — nothing to commit."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p data/clarity
          echo "$RESP" | jq '.' > data/clarity/latest.json
          echo "$RESP" | jq -c '{fetchedAt: .fetchedAt, data: .data}' >> data/clarity/history.jsonl
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Commit history
        if: steps.fetch.outputs.skip == 'false'
        run: |
          git config user.name "clarity-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/clarity
          git diff --cached --quiet || git commit -m "Clarity data pull ($(date -u +%F))"
          git push
