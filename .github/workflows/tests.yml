# Runs the guards on every push and pull request.
#
# The suite is data and structure only — no browser, no dependencies, no
# install step. It finishes in under a second, which is the point: a check that
# takes a minute gets skipped, and these are the checks that caught a wrong
# professional title on a live page.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run the guards
        run: node --test tests/*.test.mjs

      - name: Check every function still parses
        # Pages Functions are never bundled locally, so a syntax error would
        # only surface as a 500 in production.
        run: |
          for f in functions/api/*.js; do
            cp "$f" "/tmp/$(basename "$f")x.mjs"
            node --check "/tmp/$(basename "$f")x.mjs" || { echo "syntax error in $f"; exit 1; }
          done

      - name: Check every browser script still parses
        # This was a hand-written list and had quietly fallen behind: root
        # app.js (loaded by every marketing page), assets/listcards.js and
        # checkups/app.js were all shipping unchecked. Found by globbing, so
        # the list cannot go stale again — a new file is covered the day it
        # lands.
        run: |
          fail=0
          for f in $(git ls-files '*.js' | grep -v '^functions/'); do
            node --check "$f" || { echo "syntax error in $f"; fail=1; }
          done
          exit $fail
